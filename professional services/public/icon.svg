<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1464C8" />
      <stop offset="100%" stop-color="#102B4E" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6F543" />
      <stop offset="100%" stop-color="#B7E532" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#navyGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  
  <!-- Accounting Ledger / Book Base -->
  <g transform="translate(100, 110)">
    <!-- Back Spine -->
    <rect x="0" y="40" width="44" height="230" rx="12" fill="#0A1C33" opacity="0.6" />
    
    <!-- Left Page -->
    <path d="M 40,40 C 90,20 150,20 156,50 L 156,260 C 150,230 90,230 40,250 Z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- Right Page -->
    <path d="M 156,50 C 162,20 222,20 272,40 L 272,250 C 222,230 162,230 156,260 Z" fill="#FFFFFF" />
    
    <!-- Data chart bars on left page -->
    <rect x="65" y="160" width="16" height="50" rx="4" fill="#1464C8" />
    <rect x="90" y="130" width="16" height="80" rx="4" fill="#1464C8" />
    <rect x="115" y="100" width="16" height="110" rx="4" fill="#1464C8" />
    
    <!-- Ledger checkmark badge -->
    <circle cx="215" cy="155" r="50" fill="url(#limeGrad)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.25))" />
    <path d="M 195,155 L 208,168 L 235,140" fill="none" stroke="#102B4E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
