<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b33" />
      <stop offset="100%" stop-color="#040d1a" />
    </linearGradient>
    <linearGradient id="brandLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4" />

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#84cc16" opacity="0.08" filter="url(#glow)" />

  <!-- Hexagonal / Shield Technology Frame -->
  <g transform="translate(256, 256)">
    <!-- Outer Connected Nodes -->
    <circle cx="-130" cy="-70" r="14" fill="#38bdf8" opacity="0.8" />
    <circle cx="130" cy="-70" r="14" fill="#38bdf8" opacity="0.8" />
    <circle cx="0" cy="140" r="14" fill="#bef264" opacity="0.9" />

    <!-- Connection Lines -->
    <path d="M -130 -70 L 0 -140 L 130 -70 L 0 140 Z" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="6,6" />
    <path d="M -130 -70 L 0 0 L 130 -70" fill="none" stroke="#84cc16" stroke-width="5" stroke-opacity="0.5" />
    <path d="M 0 0 L 0 140" fill="none" stroke="#bef264" stroke-width="5" stroke-opacity="0.6" />

    <!-- Open Book / Ledger Silhouette (MsmeBooks Core) -->
    <path d="M -90 40 C -40 20 -10 25 0 35 C 10 25 40 20 90 40 L 90 -60 C 40 -80 10 -75 0 -65 C -10 -75 -40 -80 -90 -60 Z" fill="url(#accentCyan)" opacity="0.9" />
    
    <!-- Verified Ribbon / Spark Icon -->
    <path d="M 0 -115 L 20 -80 L 60 -75 L 30 -50 L 38 -10 L 0 -30 L -38 -10 L -30 -50 L -60 -75 L -20 -80 Z" fill="url(#brandLime)" filter="url(#glow)" />

    <!-- Partnership Central Node -->
    <circle cx="0" cy="0" r="28" fill="url(#brandLime)" />
    <circle cx="0" cy="0" r="14" fill="#040d1a" />
    <circle cx="0" cy="0" r="6" fill="#bef264" />
  </g>

  <!-- Clean Bottom Typographic Brand Mark -->
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="3">
    MSME<tspan fill="#bef264">BOOKS</tspan>
  </text>
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="1">
    PARTNER DIRECTORY
  </text>
</svg>
