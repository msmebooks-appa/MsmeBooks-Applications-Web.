<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MsmeBooks Careers & Recruitment Portal</title>
    <meta name="description" content="Explore career opportunities, search open roles, and apply to build the future of African business management technology with MsmeBooks." />
    <meta property="og:title" content="MsmeBooks Careers & Recruitment Portal" />
    <meta property="og:description" content="Explore career opportunities, search open roles, and apply to build the future of African business management technology with MsmeBooks." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MsmeBooks" />
    <meta property="og:url" content="https://www.msmebooks.org/careers" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('msmebooks_theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F9FC] text-[#14243A] dark:bg-[#0B132B] dark:text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
